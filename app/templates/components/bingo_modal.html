<div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="card-unique max-w-xs w-full text-center shadow-accent fade-in" style="animation-delay:0.2s;">
        <div class="text-5xl mb-4" style="color:var(--accent);">🎉</div>
        <h2 class="text-4xl font-bold mb-2" style="color:var(--accent);font-family:'JetBrains Mono',monospace;">BINGO!</h2>
        <p class="mb-6" style="color:var(--text-muted);font-family:'JetBrains Mono',monospace;">You completed a line!</p>
        <button
            hx-post="/dismiss-modal"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="btn-unique w-full text-lg fade-in"
            style="animation-delay:0.4s;">
            Keep Playing
        </button>
    </div>
</div>
